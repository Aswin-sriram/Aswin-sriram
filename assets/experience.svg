<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Experience">
  <defs>
    <linearGradient id="ge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#34d399"/><stop offset="100%" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="be" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".5"/><stop offset="50%" stop-color="#1f2a3a"/><stop offset="100%" stop-color="#34d399" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="se" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/><stop offset="50%" stop-color="#22d3ee" stop-opacity=".9"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="pe" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity=".05"/>
    </pattern>
    <filter id="fe" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="ce"><rect x="1" y="1" width="1198" height="648" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .fade { opacity: 0; animation: fadeUp .8s ease-out forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .orb { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translate(90px, 30px); } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.7); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <g clip-path="url(#ce)">
    <rect width="1200" height="650" fill="#0a0f1a"/>
    <rect width="1200" height="650" fill="url(#pe)"/>
    <circle class="orb" cx="1080" cy="98" r="292" fill="#34d399" opacity=".16" filter="url(#fe)"/>
    <rect x="-300" y="0" width="300" height="2" fill="url(#se)">
      <animate attributeName="x" from="-300" to="1200" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="1198" height="648" rx="20" fill="none" stroke="url(#be)" stroke-width="1.5"/>
  <text x="48" y="58" class="mono fade" style="animation-delay:0.0s" font-size="16" fill="#22d3ee" letter-spacing="2">// experience</text>
  <text x="48" y="100" class="sans fade" style="animation-delay:0.1s" font-size="34" font-weight="700" fill="#e6edf3">Software Engineer</text>
  <text x="48" y="140" class="sans fade" style="animation-delay:.2s" font-size="22" font-weight="600" fill="#34d399">Home Ideas Technologies</text>
  <g class="fade" style="animation-delay:.2s">
    <rect x="942" y="40" width="210" height="34" rx="17" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".45"/>
    <circle class="pulse" cx="962" cy="57" r="5" fill="#34d399"/>
    <text x="976" y="62" class="mono" font-size="15" font-weight="600" fill="#34d399">NOV 2025 — PRESENT</text>
    <text x="1152" y="104" text-anchor="end" class="mono" font-size="15" fill="#8b949e">Coimbatore, India</text>
  </g>
  <line x1="62" y1="182" x2="62" y2="520" stroke="#1f2a3a" stroke-width="2"/>
  <g class="fade" style="animation-delay:0.35s"><circle cx="62" cy="184" r="6" fill="#0a0f1a" stroke="#22d3ee" stroke-width="2"/>
    <text x="92" y="190" class="sans" font-size="20" fill="#c9d1d9">Build and maintain backend services and REST APIs for VIGOE, a real-time voice &amp; chat SaaS platform,</text>
    <text x="92" y="218" class="sans" font-size="20" fill="#c9d1d9">integrating WhatsApp, Gemini and OpenAI.</text>
  </g>
  <g class="fade" style="animation-delay:0.50s"><circle cx="62" cy="254" r="6" fill="#0a0f1a" stroke="#22d3ee" stroke-width="2"/>
    <text x="92" y="260" class="sans" font-size="20" fill="#c9d1d9">Cut real-time response latency from ~5–6 s to 0.6–1 s (~80%) by profiling and optimizing response</text>
    <text x="92" y="288" class="sans" font-size="20" fill="#c9d1d9">handling, backend logic and API flows.</text>
  </g>
  <g class="fade" style="animation-delay:0.65s"><circle cx="62" cy="324" r="6" fill="#0a0f1a" stroke="#22d3ee" stroke-width="2"/>
    <text x="92" y="330" class="sans" font-size="20" fill="#c9d1d9">Built a BM25-based retrieval pipeline over the platform's media data and connected RAG/LLM pipelines</text>
    <text x="92" y="358" class="sans" font-size="20" fill="#c9d1d9">to the Gemini and OpenAI APIs.</text>
  </g>
  <g class="fade" style="animation-delay:0.80s"><circle cx="62" cy="394" r="6" fill="#0a0f1a" stroke="#22d3ee" stroke-width="2"/>
    <text x="92" y="400" class="sans" font-size="20" fill="#c9d1d9">Built real-time voice over WebSockets for HIT Learn (700+ Play Store downloads) and fixed production</text>
    <text x="92" y="428" class="sans" font-size="20" fill="#c9d1d9">bugs like microphone echo and interruptions.</text>
  </g>
  <g class="fade" style="animation-delay:0.95s"><circle cx="62" cy="464" r="6" fill="#0a0f1a" stroke="#22d3ee" stroke-width="2"/>
    <text x="92" y="470" class="sans" font-size="20" fill="#c9d1d9">Own features end to end with Docker, Git and Linux on AWS, working through code reviews in a</text>
    <text x="92" y="498" class="sans" font-size="20" fill="#c9d1d9">7-developer team.</text>
  </g>
  <g class="fade" style="animation-delay:1.20s"><rect x="92" y="546" width="95" height="30" rx="15" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="140" y="566" text-anchor="middle" class="mono" font-size="16" fill="#e6edf3">Node.js</text></g>
  <g class="fade" style="animation-delay:1.26s"><rect x="197" y="546" width="124" height="30" rx="15" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="259" y="566" text-anchor="middle" class="mono" font-size="16" fill="#e6edf3">TypeScript</text></g>
  <g class="fade" style="animation-delay:1.32s"><rect x="331" y="546" width="86" height="30" rx="15" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="374" y="566" text-anchor="middle" class="mono" font-size="16" fill="#e6edf3">Python</text></g>
  <g class="fade" style="animation-delay:1.38s"><rect x="427" y="546" width="124" height="30" rx="15" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="489" y="566" text-anchor="middle" class="mono" font-size="16" fill="#e6edf3">WebSockets</text></g>
  <g class="fade" style="animation-delay:1.44s"><rect x="561" y="546" width="86" height="30" rx="15" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="604" y="566" text-anchor="middle" class="mono" font-size="16" fill="#e6edf3">Gemini</text></g>
  <g class="fade" style="animation-delay:1.50s"><rect x="656" y="546" width="86" height="30" rx="15" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="699" y="566" text-anchor="middle" class="mono" font-size="16" fill="#e6edf3">OpenAI</text></g>
  <g class="fade" style="animation-delay:1.56s"><rect x="752" y="546" width="57" height="30" rx="15" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="780" y="566" text-anchor="middle" class="mono" font-size="16" fill="#e6edf3">AWS</text></g>
  <g class="fade" style="animation-delay:1.62s"><rect x="819" y="546" width="86" height="30" rx="15" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="862" y="566" text-anchor="middle" class="mono" font-size="16" fill="#e6edf3">Docker</text></g>
</svg>
