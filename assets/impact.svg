<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Impact highlights">
  <defs>
    <linearGradient id="gi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#34d399"/><stop offset="100%" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".5"/><stop offset="50%" stop-color="#1f2a3a"/><stop offset="100%" stop-color="#34d399" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="si" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/><stop offset="50%" stop-color="#22d3ee" stop-opacity=".9"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="pi" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity=".05"/>
    </pattern>
    <filter id="fi" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="ci"><rect x="1" y="1" width="1198" height="188" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .fade { opacity: 0; animation: fadeUp .8s ease-out forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .orb { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translate(90px, 30px); } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.7); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <g class="fade" style="animation-delay:0.10s">
    <rect x="1" y="1" width="280" height="188" rx="18" fill="#0a0f1a" stroke="url(#bi)" stroke-width="1.5"/>
    <rect x="1" y="1" width="280" height="188" rx="18" fill="url(#pi)"/>
    <text x="28" y="44" class="mono" font-size="14" fill="#22d3ee" letter-spacing="2">PERFORMANCE</text>
    <text x="26" y="104" class="sans" font-size="54" font-weight="800" fill="url(#gi)">~80%</text>
    <text x="28" y="138" class="sans" font-size="19" fill="#e6edf3">lower real-time latency</text>
    <text x="28" y="166" class="mono" font-size="15" fill="#8b949e">5–6 s → 0.6–1 s</text>
  </g>
  <g class="fade" style="animation-delay:0.25s">
    <rect x="307" y="1" width="280" height="188" rx="18" fill="#0a0f1a" stroke="url(#bi)" stroke-width="1.5"/>
    <rect x="307" y="1" width="280" height="188" rx="18" fill="url(#pi)"/>
    <text x="334" y="44" class="mono" font-size="14" fill="#22d3ee" letter-spacing="2">PRODUCT</text>
    <text x="332" y="104" class="sans" font-size="54" font-weight="800" fill="url(#gi)">700+</text>
    <text x="334" y="138" class="sans" font-size="19" fill="#e6edf3">Play Store downloads</text>
    <text x="334" y="166" class="mono" font-size="15" fill="#8b949e">HIT Learn app</text>
  </g>
  <g class="fade" style="animation-delay:0.40s">
    <rect x="613" y="1" width="280" height="188" rx="18" fill="#0a0f1a" stroke="url(#bi)" stroke-width="1.5"/>
    <rect x="613" y="1" width="280" height="188" rx="18" fill="url(#pi)"/>
    <text x="640" y="44" class="mono" font-size="14" fill="#22d3ee" letter-spacing="2">RESEARCH</text>
    <text x="638" y="104" class="sans" font-size="54" font-weight="800" fill="url(#gi)">IEEE</text>
    <text x="640" y="138" class="sans" font-size="19" fill="#e6edf3">paper published</text>
    <text x="640" y="166" class="mono" font-size="15" fill="#8b949e">I-SMAC 2025 · Nepal</text>
  </g>
  <g class="fade" style="animation-delay:0.55s">
    <rect x="919" y="1" width="280" height="188" rx="18" fill="#0a0f1a" stroke="url(#bi)" stroke-width="1.5"/>
    <rect x="919" y="1" width="280" height="188" rx="18" fill="url(#pi)"/>
    <text x="946" y="44" class="mono" font-size="14" fill="#22d3ee" letter-spacing="2">EDUCATION</text>
    <text x="944" y="104" class="sans" font-size="54" font-weight="800" fill="url(#gi)">B.Tech</text>
    <text x="946" y="138" class="sans" font-size="19" fill="#e6edf3">Computer Science</text>
    <text x="946" y="166" class="mono" font-size="15" fill="#8b949e">Amrita · 2026</text>
  </g>
</svg>
