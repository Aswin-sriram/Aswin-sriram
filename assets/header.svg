<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Aswin Sriram S, Software Engineer">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="378" rx="22"/></clipPath>
    <clipPath id="typeClip">
      <rect x="80" y="262" width="0" height="40">
        <animate attributeName="width" values="0;560;560;0" keyTimes="0;0.35;0.9;1" dur="7s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .fade { opacity: 0; animation: fadeUp 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.4s; } .d3 { animation-delay: 0.7s; } .d4 { animation-delay: 1.0s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .orbA { animation: driftA 14s ease-in-out infinite alternate; }
    .orbB { animation: driftB 16s ease-in-out infinite alternate; }
    @keyframes driftA { from { transform: translate(0,0); } to { transform: translate(120px,40px); } }
    @keyframes driftB { from { transform: translate(0,0); } to { transform: translate(-140px,-50px); } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(1.6); } }
    .spin  { animation: spin 22s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spinR { animation: spin 32s linear infinite reverse; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .float { animation: float 5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#0a0f1a"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle class="orbA" cx="260" cy="90" r="170" fill="#22d3ee" opacity="0.22" filter="url(#blur)"/>
    <circle class="orbB" cx="1000" cy="300" r="190" fill="#34d399" opacity="0.20" filter="url(#blur)"/>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="22" fill="none" stroke="url(#border)" stroke-width="1.5"/>

  <!-- status pill -->
  <g class="fade d1">
    <rect x="80" y="62" width="262" height="34" rx="17" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.45"/>
    <circle class="pulse" cx="102" cy="79" r="5" fill="#34d399"/>
    <text x="118" y="84.5" class="mono" font-size="14" font-weight="600" fill="#34d399" letter-spacing="1.5">OPEN TO SWE ROLES</text>
  </g>

  <!-- name -->
  <text x="78" y="178" class="sans fade d2" font-size="76" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">Aswin Sriram S</text>

  <!-- role -->
  <text x="82" y="226" class="sans fade d3" font-size="25" font-weight="500" fill="#c9d1d9">Software Engineer <tspan fill="#22d3ee">·</tspan> Backend <tspan fill="#22d3ee">·</tspan> Cloud <tspan fill="#22d3ee">·</tspan> Applied AI</text>

  <!-- terminal line -->
  <g class="fade d4">
    <g clip-path="url(#typeClip)">
      <text x="82" y="290" class="mono" font-size="20" fill="#8b949e"><tspan fill="#34d399">❯</tspan> optimize --latency  <tspan fill="#f0883e">5.2s</tspan> → <tspan fill="#22d3ee" font-weight="700">0.6s</tspan>  <tspan fill="#34d399">✓ ~80% faster</tspan></text>
    </g>
    <rect class="cursor" x="82" y="272" width="11" height="22" fill="#22d3ee" opacity="0.9">
      <animate attributeName="x" values="82;640;640;82" keyTimes="0;0.35;0.9;1" dur="7s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- monogram orbit -->
  <g class="float">
    <circle class="spin" cx="975" cy="180" r="112" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 14" stroke-linecap="round"/>
    <circle class="spinR" cx="975" cy="180" r="88" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="60 24"/>
    <g class="spin">
      <circle cx="975" cy="180" r="112" fill="none" stroke="none"/>
      <circle cx="1087" cy="180" r="6" fill="#22d3ee"/>
      <circle cx="863" cy="180" r="4" fill="#34d399"/>
    </g>
    <circle cx="975" cy="180" r="64" fill="#0d1117" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="975" y="196" text-anchor="middle" class="mono" font-size="44" font-weight="800" fill="url(#nameGrad)">&lt;/&gt;</text>
  </g>

  <!-- footer chips -->
  <g class="fade d4" font-size="14">
    <text x="82" y="340" class="mono" fill="#8b949e">Python · TypeScript · Node.js · FastAPI · WebSockets · AWS · RAG · LLMs</text>
  </g>
</svg>
